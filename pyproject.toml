[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
dynamic = ["version"]
description = "Three local Ollama models deliberate a question and produce a consensus report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ai-council = "cli:main"

[tool.setuptools]
py-modules = ["ai_council", "cli", "council", "config", "models", "ollama", "prompts"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
